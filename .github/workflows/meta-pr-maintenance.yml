name: META PR maintenance

on:
    workflow_run:
        workflows: [Daily plugin metadata, CI]
        types: [completed]
    pull_request_review:
        types: [submitted, edited, dismissed]
    pull_request_review_comment:
        types: [created, edited, deleted]
    issue_comment:
        types: [created, edited]
    schedule:
        - cron: '*/15 * * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    issues: write
    actions: write

concurrency:
    group: meta-pr-maintenance
    cancel-in-progress: false

jobs:
    maintain:
        if: >-
            github.event_name != 'issue_comment' || github.event.issue.pull_request
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            # Privileged maintenance always executes the trusted default branch, never PR code.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Approve eligible CI runs and merge ready META PRs
              run: npm run maintain:meta-pr -- --apply
